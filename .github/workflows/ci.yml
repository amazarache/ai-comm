name: CI

on:
  push:
    branches:
      - main
      - candidate/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify release manifest and protocol digest
        run: python scripts/check_release_manifest.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Scan tracked source for credential patterns
        run: python scripts/leak_scan.py
