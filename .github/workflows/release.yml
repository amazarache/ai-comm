name: Tagged release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_release_manifest.py
      - run: python scripts/check_tag.py "$GITHUB_REF_NAME"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/leak_scan.py

  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build source archive, checksums and release notes
        run: |
          python scripts/check_tag.py "$GITHUB_REF_NAME"
          version=$(python -c 'import re; print(re.search(r"^VERSION = \"([0-9.]+)\"$", open("ai_comm.py").read(), re.M).group(1))')
          mkdir -p dist
          git archive --format=tar HEAD | gzip -n > "dist/ai-comm-${version}.tar.gz"
          python scripts/extract_release_notes.py "$version" > dist/RELEASE-NOTES.md
          cat >> dist/RELEASE-NOTES.md <<'EOF'

          This release was checked by the tagged GitHub Actions workflow.
          SHA256SUMS verifies the downloadable files. This private repository does
          not publish a provenance attestation, so publisher authenticity is not
          independently verified by the release archive.
          EOF
          (cd dist && sha256sum "ai-comm-${version}.tar.gz" > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE-NOTES.md
