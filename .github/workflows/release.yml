name: Tagged release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to verify without publishing a release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_release_manifest.py
      - name: Fetch and verify the annotated tag object
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -c 'import os,re,sys; sys.exit(0 if re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", os.environ["RELEASE_TAG"]) else 1)'
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"
          python scripts/check_tag.py "$RELEASE_TAG"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/leak_scan.py

  package:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build source archive, checksums and release notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git checkout --detach "refs/tags/$GITHUB_REF_NAME"
          python scripts/check_tag.py "$GITHUB_REF_NAME"
          version=$(python -c 'import re; print(re.search(r"^VERSION = \"([0-9.]+)\"$", open("ai_comm.py").read(), re.M).group(1))')
          mkdir -p dist
          git archive --format=tar HEAD | gzip -n > "dist/ai-comm-${version}.tar.gz"
          python scripts/extract_release_notes.py "$version" > dist/RELEASE-NOTES.md
          cat >> dist/RELEASE-NOTES.md <<'EOF'

          This release was checked by the tagged GitHub Actions workflow.
          SHA256SUMS verifies the source archive and the bootstrap. This repository does
          not publish a provenance attestation, so publisher authenticity is not
          independently verified by the release archive.
          EOF
          python scripts/render_bootstrap.py --check
          python scripts/render_bootstrap.py "$version" --out dist/install-ai-comm.sh
          bootstrap_sha=$(sha256sum dist/install-ai-comm.sh | cut -d" " -f1)
          grep -qF "| \`v${version}\` | \`install-ai-comm.sh\` | \`${bootstrap_sha}\` |" docs/INSTALL.md
          cat >> dist/RELEASE-NOTES.md <<EOF

          One-line install of this release into the per-user cache (see docs/INSTALL.md; verify-first variant there):
          curl -fsSL --proto =https --proto-redir =https --tlsv1.2 https://github.com/amazarache/ai-comm/releases/download/v${version}/install-ai-comm.sh | sh
          install-ai-comm.sh sha256: ${bootstrap_sha}
          EOF
          (cd dist && sha256sum "ai-comm-${version}.tar.gz" install-ai-comm.sh > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE-NOTES.md
