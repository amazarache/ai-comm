name: Manual stability checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the complete suite 20 times
        run: |
          for run in $(seq 1 20); do
            python -m unittest discover -s tests -q
          done
      - name: Repeat notification-arrival race test 200 times
        run: |
          for run in $(seq 1 200); do
            python -m unittest tests.test_protocol.ProtocolTests.test_notification_wait_observes_later_arrival_without_ack -q
          done
